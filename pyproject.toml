[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimlx-runtime"
version = "0.1.2"
description = "Python MLX runtime core for MiniMLX"
license = { file = "LICENSE" }
requires-python = ">=3.11"

[project.scripts]
minimlx-runtime = "minimlx_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
